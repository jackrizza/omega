[package]
name = "omega-training"
version = "0.1.0"
edition = "2024"

[features]
default = []
gpu = ["burn/vulkan", "dep:wgpu"]
cuda = ["burn/cuda", "dep:cudarc"]

[dependencies]
burn = { version = "0.18.0", default-features = false, features = ["std", "ndarray", "autodiff"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
omega-nn = { path = "../omega-nn" }
omega-tokenizer = { path = "../omega-tokenizer" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

wgpu = { version = "25", optional = true, default-features = false, features = ["vulkan", "wgsl"] }

[[example]]
name = "gpu_probe"
required-features = ["gpu"]

[[example]]
name = "gpu_benchmark"
required-features = ["gpu"]

[dependencies.cudarc]
version = "0.16.6"
optional = true
default-features = false
features = ["std", "driver", "nvrtc", "cuda-12050", "dynamic-loading"]

[dev-dependencies]
anyhow = "1"
omega-datasets = { path = "../omega-datasets" }
tempfile = "3"

[build-dependencies]
sha2 = "0.10"
