[package]
name = "omega-benchmark"
version = "0.1.0"
edition = "2024"

[features]
default = []
gpu = ["omega-training/gpu"]
cuda = ["omega-training/cuda"]

[dependencies]
burn = { version = "0.18.0", default-features = false, features = ["std", "ndarray", "autodiff"] }
clap = { version = "4.6.7", features = ["derive"] }
omega-nn = { path = "../omega-nn" }
omega-tokenizer = { path = "../omega-tokenizer" }
omega-training = { path = "../omega-training" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
